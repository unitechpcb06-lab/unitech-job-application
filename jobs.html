<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#071d3f">
<title>ร่วมงานกับเรา · UNITECH PCB (Thailand)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Noto+Sans+Myanmar:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#071d3f;--navy2:#0b2f66;--blue:#1158c7;--sky:#e8f0fd;--gold:#f5b324;
  --ink:#14203a;--muted:#62708a;--line:#e4e9f2;--bg:#f5f7fb;--card:#fff;
  --green:#12945a;--green-bg:#e3f6ec;--gray:#8a93a5;--gray-bg:#eef1f5;
  --r:18px;--shadow:0 1px 2px rgba(10,30,70,.04),0 8px 24px rgba(10,30,70,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;font-family:"IBM Plex Sans Thai","Noto Sans Myanmar",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;padding-bottom:84px}
body.my{font-family:"Noto Sans Myanmar","IBM Plex Sans Thai",system-ui,sans-serif;line-height:1.95}
.wrap{max-width:960px;margin:0 auto;padding:0 18px}

/* ---------- HERO ---------- */
.hero{position:relative;overflow:hidden;color:#fff;
  background:radial-gradient(1200px 500px at 85% -10%,#1b56b8 0%,transparent 60%),linear-gradient(160deg,var(--navy) 0%,var(--navy2) 100%);
  padding:18px 0 92px}
.hero svg.circuit{position:absolute;inset:0;width:100%;height:100%;opacity:.18;pointer-events:none}
.nav{position:relative;display:flex;justify-content:space-between;align-items:center}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.2px}
.brand .dot{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--gold),#ffd76e);display:grid;place-items:center;color:var(--navy);font-weight:800;font-size:15px}
.brand img{height:34px;background:#fff;border-radius:8px;padding:3px}
.brand small{display:block;font-weight:500;opacity:.7;font-size:11px;line-height:1.2}
.lang{display:flex;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:3px;backdrop-filter:blur(6px)}
.lang button{border:0;background:transparent;color:#fff;font:inherit;font-size:13px;padding:5px 13px;border-radius:999px;cursor:pointer}
.lang button.on{background:#fff;color:var(--navy);font-weight:700}
.hero-body{position:relative;margin-top:34px;max-width:640px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;background:rgba(245,179,36,.16);color:#ffd76e;border:1px solid rgba(245,179,36,.35);padding:4px 12px;border-radius:999px;font-size:13px;font-weight:600}
.eyebrow i{width:8px;height:8px;border-radius:50%;background:#3ddc84;box-shadow:0 0 0 0 rgba(61,220,132,.7);animation:pulse 1.8s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(61,220,132,0)}100%{box-shadow:0 0 0 0 rgba(61,220,132,0)}}
.hero h1{font-size:clamp(28px,5.5vw,44px);line-height:1.2;margin:14px 0 8px;font-weight:700;letter-spacing:-.3px}
body.my .hero h1{line-height:1.5}
.hero h1 em{font-style:normal;color:var(--gold)}
.hero p{margin:0;opacity:.85;font-size:15px}
.cta{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.cta a{text-decoration:none;font-weight:700;font-size:15px;padding:11px 20px;border-radius:12px}
.cta .p{background:var(--gold);color:var(--navy)}
.cta .s{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.25)}

/* ---------- STATS ---------- */
.stats{position:relative;margin-top:-58px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stat{background:var(--card);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);border:1px solid var(--line)}
.stat b{display:block;font-size:26px;line-height:1.2;color:var(--navy2);font-weight:700}
.stat span{font-size:13px;color:var(--muted)}

/* ---------- FILTER ---------- */
.filters{position:sticky;top:0;z-index:20;background:rgba(245,247,251,.92);backdrop-filter:blur(10px);margin:22px -18px 0;padding:10px 18px;border-bottom:1px solid transparent;transition:border-color .2s}
.filters.stuck{border-color:var(--line)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:#fff;font:inherit;font-size:14px;padding:7px 14px;border-radius:999px;cursor:pointer;color:var(--ink);display:flex;align-items:center;gap:6px;transition:.15s}
.chip:hover{border-color:#c6d3ea}
.chip .n{font-size:12px;background:var(--gray-bg);color:var(--muted);border-radius:999px;padding:0 7px;min-width:22px;text-align:center}
.chip.on{background:var(--navy2);border-color:var(--navy2);color:#fff}
.chip.on .n{background:rgba(255,255,255,.2);color:#fff}
.sub-row{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:13px;color:var(--muted);gap:10px}
.toggle{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.toggle input{display:none}
.toggle .tr{width:34px;height:20px;border-radius:999px;background:#cfd6e2;position:relative;transition:.2s;flex:none}
.toggle .tr:after{content:"";position:absolute;width:16px;height:16px;top:2px;left:2px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.toggle input:checked+.tr{background:var(--blue)}
.toggle input:checked+.tr:after{transform:translateX(14px)}

.notice{background:#fff7e3;color:#8a5a00;border:1px solid #f6e1a8;padding:10px 14px;border-radius:12px;font-size:14px;margin-top:14px;display:none}

/* ---------- CARDS ---------- */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px;align-items:start}
.card{background:var(--card);border-radius:var(--r);border:1px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;transition:transform .15s,box-shadow .15s;animation:in .35s ease both}
.card:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(10,30,70,.05),0 14px 32px rgba(10,30,70,.10)}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.card.full{background:#fbfcfd}
.card.full .ic,.card.full .title{filter:grayscale(1);opacity:.6}
.ch{padding:16px 16px 12px;display:flex;gap:12px}
.ic{width:46px;height:46px;border-radius:14px;flex:none;display:grid;place-items:center;font-size:22px}
.tt{flex:1;min-width:0}
.top-line{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.grp{font-size:12px;color:var(--muted);font-weight:500}
.title{font-size:16.5px;font-weight:700;margin:2px 0 0;line-height:1.4}
.badge{flex:none;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.b-open{background:var(--green-bg);color:var(--green)}
.b-full{background:var(--gray-bg);color:var(--gray)}
.tags{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 12px}
.tag{font-size:12.5px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:3px 9px;color:#33415c}
.tag.slots{background:#fff4d6;border-color:#f6dd96;color:#7a5400;font-weight:700}
.tag.money{background:var(--sky);border-color:#cfe0fb;color:var(--navy2);font-weight:600}
.more{border:0;background:none;font:inherit;color:var(--blue);font-weight:600;font-size:14px;padding:0 16px 12px;text-align:left;cursor:pointer}
.details{display:none;padding:0 16px 6px;border-top:1px dashed var(--line)}
.card.open .details{display:block}
.sec h4{margin:12px 0 4px;font-size:13.5px;color:var(--navy2);display:flex;align-items:center;gap:6px}
.sec ul{margin:0;padding:0;list-style:none;font-size:14px}
.sec li{position:relative;padding-left:16px;margin:3px 0;color:#33415c}
.sec li:before{content:"";position:absolute;left:3px;top:.7em;width:6px;height:6px;border-radius:2px;background:var(--blue);opacity:.55}
.kv{font-size:13.5px;color:#33415c;margin:4px 0}
.kv b{color:var(--ink)}
.cf{margin-top:auto;padding:12px 16px 16px}
.apply{display:flex;justify-content:center;align-items:center;gap:8px;text-decoration:none;background:linear-gradient(135deg,var(--blue),var(--navy2));color:#fff;font-weight:700;padding:11px;border-radius:12px;font-size:15px;transition:filter .15s}
.apply:hover{filter:brightness(1.1)}
.apply.off{background:var(--gray-bg);color:var(--gray);pointer-events:none;font-weight:600}
.fn{font-size:12.5px;color:var(--muted);text-align:center;margin-top:6px}

.skel{height:190px;border-radius:var(--r);background:linear-gradient(90deg,#eef1f6 25%,#f7f9fc 50%,#eef1f6 75%);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
.empty{grid-column:1/-1;text-align:center;background:#fff;border:1px dashed #cfd8e6;border-radius:var(--r);padding:36px 16px;color:var(--muted)}
.empty div{font-size:34px}

/* ---------- SECTIONS ---------- */
section.blk{margin-top:44px}
.blk h2{font-size:22px;margin:0 0 4px}
.blk .lead{color:var(--muted);font-size:14px;margin:0 0 16px}
.ben{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.bt{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;gap:12px;align-items:flex-start;box-shadow:var(--shadow)}
.bt .e{font-size:22px;width:40px;height:40px;border-radius:12px;background:var(--sky);display:grid;place-items:center;flex:none}
.bt div{font-size:14px;color:#33415c}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;counter-reset:s}
.step{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;position:relative;box-shadow:var(--shadow);font-size:14px;color:#33415c}
.step:before{counter-increment:s;content:counter(s);display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--navy2);color:#fff;font-weight:700;margin-bottom:8px}
.status-box{margin-top:14px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border-radius:var(--r);padding:16px 18px;flex-wrap:wrap}
.status-box a{background:#fff;color:var(--navy);text-decoration:none;font-weight:700;padding:9px 16px;border-radius:10px;font-size:14px}
footer{text-align:center;font-size:12px;color:var(--muted);padding:30px 16px 10px}

.hl{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.hl span{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:10px;padding:5px 11px;font-size:13.5px;font-weight:600}
.tag.night{background:#ece9ff;border-color:#d6d0ff;color:#3b2f9e;font-weight:600}
.contacts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ct{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;text-decoration:none;color:var(--ink);box-shadow:var(--shadow)}
.ct .av{width:44px;height:44px;border-radius:50%;background:var(--sky);display:grid;place-items:center;font-size:20px;flex:none}
.ct b{display:block;font-size:15px}.ct small{color:var(--muted);font-size:13.5px}
.ct .go{margin-left:auto;background:var(--green);color:#fff;font-weight:700;font-size:13px;padding:7px 14px;border-radius:10px}
@media (max-width:760px){.contacts{grid-template-columns:1fr}}
/* ---------- MOBILE DOCK ---------- */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:rgba(255,255,255,.95);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:none;gap:10px}
.dock a{flex:1;text-align:center;text-decoration:none;font-weight:700;padding:11px;border-radius:12px;font-size:14px}
.dock .a1{background:var(--gold);color:var(--navy)}
.dock .a2{background:var(--sky);color:var(--navy2)}

@media (max-width:760px){
  .grid{grid-template-columns:1fr}
  .ben{grid-template-columns:1fr 1fr}
  .steps{grid-template-columns:1fr 1fr}
  .stats{gap:8px}.stat{padding:12px}.stat b{font-size:21px}.stat span{font-size:12px}
  .dock{display:flex}
}
@media (max-width:420px){.ben{grid-template-columns:1fr}}
@media (min-width:761px){body{padding-bottom:0}}
</style>
</head>
<body>

<header class="hero">
  <svg class="circuit" viewBox="0 0 800 400" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <g fill="none" stroke="#9cc3ff" stroke-width="1.4">
      <path d="M0 80h180l40 40h160l30-30h120"/><path d="M0 300h120l50-50h200l40 40h290"/>
      <path d="M560 0v90l40 40v120l-40 40v110"/><path d="M700 0v60l-40 40v80"/><path d="M380 400v-80l30-30h120"/>
      <path d="M260 0v50l-30 30"/><path d="M800 180h-90l-30 30h-60"/>
    </g>
    <g fill="#9cc3ff"><circle cx="530" cy="90" r="4"/><circle cx="660" cy="180" r="4"/><circle cx="530" cy="290" r="4"/><circle cx="230" cy="80" r="4"/><circle cx="620" cy="210" r="4"/><circle cx="170" cy="250" r="4"/></g>
  </svg>
  <div class="wrap">
    <div class="nav">
      <div class="brand" id="brand"></div>
      <div class="lang"><button data-l="th">ไทย</button><button data-l="my">မြန်မာ</button></div>
    </div>
    <div class="hero-body">
      <span class="eyebrow"><i></i><span id="eyebrow"></span></span>
      <h1 id="h1"></h1>
      <p id="sub"></p>
      <div class="hl" id="hl"></div>
      <div class="cta"><a class="p" href="#jobs" id="cta1"></a><a class="s" href="#benefits" id="cta2"></a></div>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="stats" id="stats"></div>

  <div class="filters" id="filters">
    <div class="chips" id="chips"></div>
    <div class="sub-row"><span id="count"></span></div>
  </div>
  <div class="notice" id="notice"></div>
  <div class="grid" id="jobs"></div>

  <section class="blk" id="benefits"><h2 id="payT"></h2><p class="lead" id="payLead"></p><div class="ben" id="ben"></div></section>
  <section class="blk" id="howto"><h2 id="howT"></h2><p class="lead" id="howLead"></p><div class="steps" id="steps"></div>
    <div class="status-box"><span id="stTxt"></span><a id="stLink" target="_blank" rel="noopener"></a></div></section>
  <section class="blk" id="contact"><h2 id="ctT"></h2><p class="lead" id="ctLead"></p><div class="contacts" id="contacts"></div></section>
</main>
<footer id="foot"></footer>

<div class="dock"><a class="a1" href="#jobs" id="d1"></a><a class="a2" href="#contact" id="d2"></a></div>

<script>
/* ===================== ตั้งค่า (แก้ครั้งเดียว) ===================== */
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzC3q5F6quCt_MUcBiiiyXLAgRc2GFg6FL1PYj-xAKxa35P3LSM4l0N6Ng5Cld2NmJX/exec";   // ← วาง Web app URL ของ Apps Script (ลงท้าย /exec)
const APPLY_URL  = "https://unitechpcb06-lab.github.io/unitech-job-application/";
const STATUS_URL = "https://unitechpcb06-lab.github.io/unitech-job-application/status.html";
const DAY_ONLY = ["WH-STAFF"];   // ← id ตำแหน่งที่มีแต่กะเช้า (ดู id ได้ในหลังบ้าน) เช่น ["WH-STAFF","MT-TECH"]
const NIGHT_ONLY = [];   // ← id ตำแหน่งที่เป็นกะดึกยาวตลอด เช่น ["MA2D0-D2","MB2F0-QR"]
const CONTACTS = [   // ← เบอร์ติดต่อ
  {name:"คุณเอส", my:"S", tel:"035-945-073", ext:"82522"},
  {name:"คุณโย",  my:"Yo", tel:"035-945-073", ext:"82523"}
];
const LOGO_URL   = "";   // เช่น "logo.png" (ว่าง = แสดงชื่อบริษัท)
/* ================================================================ */

const GROUPS = [{"id": "PD1", "th": "ฝ่ายผลิต 1", "my": "ထုတ်လုပ်ရေး 1"}, {"id": "PD2", "th": "ฝ่ายผลิต 2", "my": "ထုတ်လုပ်ရေး 2"}, {"id": "PD3", "th": "ฝ่ายผลิต 3", "my": "ထုတ်လုပ်ရေး 3"}, {"id": "PD4", "th": "ฝ่ายผลิต 4", "my": "ထုတ်လုပ်ရေး 4"}, {"id": "QC", "th": "ตรวจสอบคุณภาพ (QC)", "my": "အရည်အသွေး စစ်ဆေးရေး (QC)"}, {"id": "QA", "th": "ประกันคุณภาพ (QA)", "my": "အရည်အသွေး အာမခံ (QA)"}, {"id": "MT", "th": "ช่างซ่อมบำรุง", "my": "စက်ပြင်"}, {"id": "WH", "th": "คลังสินค้า", "my": "ဂိုဒေါင်"}];

  {"id":"QA1F0-IQC","group":"QC","code":"QA1F0","title":{"th":"เจ้าหน้าที่ตรวจสอบวัตถุดิบ, สารเคมี และการสอบเทียบ","my":"ကုန်ကြမ်း၊ ဓာတုပစ္စည်းနှင့် Calibration စစ်ဆေးရေး ဝန်ထမ်း"},"duties":{"th":["ตรวจสอบวัตถุดิบขาเข้าและสารเคมีที่ใช้ในกระบวนการผลิต โดยใช้เครื่องมือวัดละเอียด เช่น ไมโครมิเตอร์ และเวอร์เนียร์คาลิเปอร์ เป็นต้น","เก็บตัวอย่างและวิเคราะห์สารเคมีหรือสารละลายที่ใช้ในกระบวนการผลิต ตรวจสอบคุณภาพของสารเคมีโดยการใช้เทคนิคการไตเตรต และรายงานผลการตรวจสอบคุณภาพไปยังไลน์ผลิต","สอบเทียบเครื่องมือวัดละเอียดหรือเครื่องมือที่เกี่ยวข้องกับการวิเคราะห์","ติดตามอาการผิดปกติ (NG) ที่เกิดกับวัตถุดิบและสารเคมี"],"my":["micrometer၊ vernier caliper စသည့် တိကျသော တိုင်းတာရေးကိရိယာဖြင့် ဝင်လာသော ကုန်ကြမ်းနှင့် ထုတ်လုပ်ရေးသုံး ဓာတုပစ္စည်းများ စစ်ဆေးခြင်း","ထုတ်လုပ်ရေးသုံး ဓာတုပစ္စည်း/ဆေးရည် နမူနာယူ၍ titration နည်းဖြင့် ခွဲခြမ်းစိတ်ဖြာပြီး ရလဒ်ကို ထုတ်လုပ်ရေးလိုင်းသို့ အစီရင်ခံခြင်း","တိကျသော တိုင်းတာရေးကိရိယာ သို့မဟုတ် ခွဲခြမ်းစိတ်ဖြာရေး ကိရိယာများကို ချိန်ညှိ (calibrate) ခြင်း","ကုန်ကြမ်းနှင့် ဓာတုပစ္စည်းတွင် ဖြစ်ပေါ်သော ပုံမှန်မဟုတ်မှု (NG) များကို ခြေရာခံခြင်း"]},"quals":{"th":["ไม่จำกัดเพศ อายุ 18 ปีขึ้นไป (ไม่จำกัดอายุสูงสุด)","ทำงานเป็นกะได้ สุขภาพแข็งแรง"],"my":["ကျား/မ မရွေး၊ အသက် 18 နှစ်နှင့်အထက် (အသက်အကြီးဆုံး ကန့်သတ်ချက် မရှိ)","ဆိုင်းလှည့် အလုပ်လုပ်နိုင်ပြီး ကျန်းမာသန်စွမ်းသူ"]}},
  {"id":"QA1F0-IQCCHEM","group":"QC","code":"QA1F0","title":{"th":"เจ้าหน้าที่ตรวจสอบสารเคมี","my":"ဓာတုပစ္စည်း စစ်ဆေးရေး ဝန်ထမ်း"},"duties":{"th":["ตรวจสอบและวิเคราะห์คุณภาพสารเคมีจากไลน์การผลิต โดยใช้เทคนิคทางห้องปฏิบัติการ เช่น การไตเตรต และการใช้งานเครื่องมือวิเคราะห์ต่าง ๆ เพื่อควบคุมคุณภาพให้เป็นไปตามมาตรฐานที่กำหนด","จัดเตรียมและผสมสารเคมีที่ใช้สำหรับการวิเคราะห์คุณภาพ รวมถึงดูแลการจัดเก็บสารเคมีในห้องปฏิบัติการให้ถูกต้องและปลอดภัยตามมาตรฐาน","ตรวจสอบสภาพความพร้อมใช้งานของเครื่องมือและอุปกรณ์ภายในห้องปฏิบัติการ พร้อมทั้งแจ้งปัญหาหรือประสานงานเมื่อพบความผิดปกติ","ดูแลและรักษาสภาพแวดล้อมภายในห้องปฏิบัติการให้สะอาด เป็นระเบียบ และพร้อมสำหรับการปฏิบัติงานอยู่เสมอ","จัดทำรายงานผลการวิเคราะห์สารเคมี รวมถึงเอกสารที่เกี่ยวข้องกับงานห้องปฏิบัติการ"],"my":["titration နှင့် ခွဲခြမ်းစိတ်ဖြာရေးကိရိယာများ သုံး၍ ထုတ်လုပ်ရေးလိုင်းမှ ဓာတုပစ္စည်း အရည်အသွေးကို စံနှုန်းအတိုင်း စစ်ဆေးခြင်း","ခွဲခြမ်းစိတ်ဖြာရန် ဓာတုပစ္စည်း ပြင်ဆင်ရောစပ်ခြင်းနှင့် ဓာတ်ခွဲခန်းတွင် ဘေးကင်းစွာ သိုလှောင်ခြင်း","ဓာတ်ခွဲခန်း ကိရိယာများ အသုံးပြုနိုင်မှု စစ်ဆေးပြီး ပုံမှန်မဟုတ်ပါက အကြောင်းကြား/ညှိနှိုင်းခြင်း","ဓာတ်ခွဲခန်းကို သန့်ရှင်း၊ စနစ်တကျ၊ အမြဲ အသင့်ဖြစ်အောင် ထိန်းသိမ်းခြင်း","ဓာတုပစ္စည်း ခွဲခြမ်းစိတ်ဖြာမှု ရလဒ်အစီရင်ခံစာနှင့် ဓာတ်ခွဲခန်းဆိုင်ရာ စာရွက်စာတမ်း ပြုစုခြင်း"]},"quals":{"th":["ไม่จำกัดเพศ อายุ 18 ปีขึ้นไป (ไม่จำกัดอายุสูงสุด)","ทำงานเป็นกะได้ สุขภาพแข็งแรง"],"my":["ကျား/မ မရွေး၊ အသက် 18 နှစ်နှင့်အထက် (အသက်အကြီးဆုံး ကန့်သတ်ချက် မရှိ)","ဆိုင်းလှည့် အလုပ်လုပ်နိုင်ပြီး ကျန်းမာသန်စွမ်းသူ"]}},
  {"id":"QA100-CALIBRATION","group":"QC","code":"QA100","title":{"th":"เจ้าหน้าที่การสอบเทียบเทียบเครื่องมือ","my":"တိုင်းတာရေးကိရိယာ ချိန်ညှိ (Calibration) ဝန်ထမ်း"},"duties":{"th":["ตรวจสอบสถานะการสอบเทียบของเครื่องมือวัดก่อนใช้งาน เพื่อให้มั่นใจว่าอยู่ในสภาพพร้อมใช้งานและไม่หมดอายุ","ใช้งานเครื่องมือวัดให้ถูกต้องตามวิธีการที่กำหนด และเลือกใช้อุปกรณ์ให้เหมาะสมกับลักษณะงาน","บันทึกผลการวัดและข้อมูลที่เกี่ยวข้องอย่างถูกต้อง ครบถ้วน และสามารถตรวจสอบย้อนหลังได้"],"my":["တိုင်းတာရေးကိရိယာ မသုံးမီ calibration အခြေအနေ (သက်တမ်းမကုန်) စစ်ဆေးခြင်း","တိုင်းတာရေးကိရိယာကို သတ်မှတ်နည်းအတိုင်း မှန်ကန်စွာသုံးပြီး အလုပ်နှင့်သင့်တော်သည့် ကိရိယာ ရွေးချယ်ခြင်း","တိုင်းတာမှုရလဒ်နှင့် ဆက်စပ်ဒေတာကို မှန်ကန်ပြည့်စုံစွာ နောက်ကြောင်းပြန်စစ်နိုင်အောင် မှတ်တမ်းတင်ခြင်း"]},"quals":{"th":["ไม่จำกัดเพศ อายุ 18 ปีขึ้นไป (ไม่จำกัดอายุสูงสุด)","ทำงานเป็นกะได้ สุขภาพแข็งแรง","มีความคุ้นเคยและสามารถใช้งานเครื่องมือวัดพื้นฐาน เช่น เวอร์เนีย ไมโครมิเตอร์ เป็นต้น"],"my":["ကျား/မ မရွေး၊ အသက် 18 နှစ်နှင့်အထက် (အသက်အကြီးဆုံး ကန့်သတ်ချက် မရှိ)","ဆိုင်းလှည့် အလုပ်လုပ်နိုင်ပြီး ကျန်းမာသန်စွမ်းသူ","vernier၊ micrometer စသည့် အခြေခံ တိုင်းတာရေးကိရိယာများ သုံးတတ်သူ"]}},
  {"id":"QA1G0-IPQC","group":"QC","code":"QA1G0","title":{"th":"เจ้าหน้าที่สุ่มตรวจผลิตภัณฑ์ขณะผลิต (IPQC)","my":"ထုတ်လုပ်နေစဉ် ကျပန်းစစ်ဆေးရေး ဝန်ထမ်း (IPQC)"},"duties":{"th":["เดินตรวจสอบไลน์ผลิต","สุ่มตรวจคุณภาพของผลิตภัณฑ์ในแต่ละไลน์ผลิต","วิเคราะห์ชิ้นงานและติดตามอาการผิดปกติ (NG)","มีประสบการณ์ใช้กล้องจุลทรรศน์","ตรวจสอบภายนอกและภายใน PCB"],"my":["ထုတ်လုပ်ရေးလိုင်းကို လှည့်လည်စစ်ဆေးခြင်း","လိုင်းတစ်ခုချင်းစီရှိ ထုတ်ကုန် အရည်အသွေးကို ကျပန်းစစ်ဆေးခြင်း","ထုတ်ကုန်ကို ခွဲခြမ်းစိတ်ဖြာပြီး ပုံမှန်မဟုတ်မှု (NG) ကို ခြေရာခံခြင်း","အဏုကြည့်မှန်ပြောင်း သုံးဖူးသည့် အတွေ့အကြုံ","PCB ၏ အပြင်ပိုင်းနှင့် အတွင်းပိုင်း စစ်ဆေးခြင်း"]},"quals":{"th":["ไม่จำกัดเพศ อายุ 18 ปีขึ้นไป (ไม่จำกัดอายุสูงสุด)","ทำงานเป็นกะได้ สุขภาพแข็งแรง","สามารถใช้เครื่องมือวัดได้"],"my":["ကျား/မ မရွေး၊ အသက် 18 နှစ်နှင့်အထက် (အသက်အကြီးဆုံး ကန့်သတ်ချက် မရှိ)","ဆိုင်းလှည့် အလုပ်လုပ်နိုင်ပြီး ကျန်းမာသန်စွမ်းသူ","တိုင်းတာရေးကိရိယာ သုံးတတ်သူ"]}},
  {"id":"QA2A0-OS","group":"QC","code":"QA2A0","title":{"th":"เจ้าหน้าที่ตรวจสอบ Open/Short Circuit","my":"Open/Short Circuit စစ်ဆေးရေး ဝန်ထမ်း"},"duties":{"th":["ตรวจสอบบอร์ด PCB โดยการส่องกล้อง","ร่วมวิเคราะห์สาเหตุและแก้ไขปัญหากับฝ่ายผลิต"],"my":["PCB ဘုတ်ကို မှန်ပြောင်းဖြင့် ကြည့်ရှုစစ်ဆေးခြင်း","ထုတ်လုပ်ရေးဌာနနှင့်အတူ ပြဿနာ၏ အကြောင်းရင်း ခွဲခြမ်းစိတ်ဖြာ/ဖြေရှင်းခြင်း"]},"quals":{"th":["ไม่จำกัดเพศ อายุ 18 ปีขึ้นไป (ไม่จำกัดอายุสูงสุด)","ทำงานเป็นกะได้ สุขภาพแข็งแรง","ใช้เครื่องมือมัลติมิเตอร์ในการตรวจสอบ OPEN / SHORT จะพิจารณาเป็นพิเศษ","สามารถดูลายวงจรไฟฟ้าได้ จะพิจารณาเป็นพิเศษ","สามารถบันทึกรายงานได้ สามารถ บวก ลบ คูณ หาร ได้"],"my":["ကျား/မ မရွေး၊ အသက် 18 နှစ်နှင့်အထက် (အသက်အကြီးဆုံး ကန့်သတ်ချက် မရှိ)","ဆိုင်းလှည့် အလုပ်လုပ်နိုင်ပြီး ကျန်းမာသန်စွမ်းသူ","multimeter ဖြင့် OPEN/SHORT စစ်ဆေးတတ်သူကို ဦးစားပေးမည်","လျှပ်စစ်ဆားကစ်ပုံ ကြည့်တတ်သူကို ဦးစားပေးမည်","အစီရင်ခံစာ မှတ်တမ်းရေးနိုင်ပြီး ပေါင်း၊ နုတ်၊ မြှောက်၊ စား တွက်တတ်သူ"]}},
  {"id":"QA2D0-OSP","group":"QA","code":"QA2D0","title":{"th":"เจ้าหน้าที่ควบคุมคุณภาพขั้นสุดท้าย (FQC) – OSP","my":"နောက်ဆုံးအဆင့် အရည်အသွေး ထိန်းချုပ်ရေး ဝန်ထမ်း (FQC) – OSP"},"duties":{"th":["กระบวนการอบและเคลือบผลิตภัณฑ์ PCB สำเร็จรูป","ตรวจสอบสภาพเครื่องจักร บันทึกการตั้งค่าเครื่อง บำรุงรักษาเครื่องได้","บันทึกการผลิตประจำวัน","ตรวจสอบระดับน้ำยา / สารเคมี ในแต่ละถังว่าเป็นไปตามมาตรฐาน","ตรวจสอบคุณภาพของชิ้นงานหลังเสร็จสิ้นกระบวนการ"],"my":["PCB ကုန်ချောကို ဖုတ်ခြင်းနှင့် မျက်နှာပြင်အုပ်ခြင်း လုပ်ငန်းစဉ်","စက်အခြေအနေ စစ်ဆေး၊ စက်ချိန်ညှိတန်ဖိုး မှတ်တမ်းတင်ပြီး စက်ထိန်းသိမ်းနိုင်ခြင်း","နေ့စဉ် ထုတ်လုပ်မှု မှတ်တမ်းတင်ခြင်း","ကန်တစ်ခုချင်းစီရှိ ဆေးရည်/ဓာတုပစ္စည်း အဆင့်ကို စံနှုန်းအတိုင်း စစ်ဆေးခြင်း","လုပ်ငန်းစဉ်ပြီးနောက် ထုတ်ကုန် အရည်အသွေး စစ်ဆေးခြင်း"]},"quals":{"th":["ไม่จำกัดเพศ อายุ 18 ปีขึ้นไป (ไม่จำกัดอายุสูงสุด)","ทำงานเป็นกะได้ สุขภาพแข็งแรง","สามารถปฏิบัติงานในพื้นที่ที่เป็นสารเคมีได้"],"my":["ကျား/မ မရွေး၊ အသက် 18 နှစ်နှင့်အထက် (အသက်အကြီးဆုံး ကန့်သတ်ချက် မရှိ)","ဆိုင်းလှည့် အလုပ်လုပ်နိုင်ပြီး ကျန်းမာသန်စွမ်းသူ","ဓာတုပစ္စည်းရှိသောနေရာတွင် အလုပ်လုပ်နိုင်သူ"]}},

  {"id":"QA1C0-OQC","group":"QA","code":"QA1C0","title":{"th":"เจ้าหน้าที่ตรวจสอบผลิตภัณฑ์สำเร็จรูป – OQC","my":"ကုန်ချော စစ်ဆေးရေး ဝန်ထမ်း – OQC"},"duties":{"th":["สุ่มตรวจสอบคุณภาพชิ้นงานตาม Quality Control Plan","ตรวจสอบความถูกต้องของหัวข้อการวัดตามแบบที่ลูกค้ากำหนด","เตรียมชิ้นงานสำหรับทดสอบตามเงื่อนไขที่ลูกค้ากำหนด","บันทึกผลการวัดและประเมินผลการวัดตามเกณฑ์ที่ลูกค้ากำหนด","สรุปผลและจัดทำรายงานผลการตรวจสอบ"],"my":["Quality Control Plan အတိုင်း ထုတ်ကုန် အရည်အသွေး ကျပန်းစစ်ဆေးခြင်း","ဖောက်သည်သတ်မှတ်ပုံစံအတိုင်း တိုင်းတာရမည့်အချက်များ မှန်ကန်မှု စစ်ဆေးခြင်း","ဖောက်သည်သတ်မှတ်ချက်အတိုင်း စမ်းသပ်ရန် ထုတ်ကုန်နမူနာ ပြင်ဆင်ခြင်း","ဖောက်သည်စံနှုန်းအတိုင်း တိုင်းတာမှုရလဒ် မှတ်တမ်းတင်ပြီး အကဲဖြတ်ခြင်း","စစ်ဆေးမှုရလဒ် အနှစ်ချုပ်ပြီး အစီရင်ခံစာ ပြုစုခြင်း"]},"quals":{"th":["ไม่จำกัดเพศ อายุ 18 ปีขึ้นไป (ไม่จำกัดอายุสูงสุด)","ทำงานเป็นกะได้ สุขภาพแข็งแรง","สามารถอ่านแบบ (Drawing) ได้","มีความเข้าใจในเรื่องการแปลงหน่วย (µm, mm, inch)"],"my":["ကျား/မ မရွေး၊ အသက် 18 နှစ်နှင့်အထက် (အသက်အကြီးဆုံး ကန့်သတ်ချက် မရှိ)","ဆိုင်းလှည့် အလုပ်လုပ်နိုင်ပြီး ကျန်းမာသန်စွမ်းသူ","ပုံစံ (Drawing) ဖတ်တတ်သူ","ယူနစ်ပြောင်းလဲခြင်း (µm, mm, inch) ကို နားလည်သူ"]}},

Object.assign(T.th,{brandSub:"สาขาอ่างทอง",eyebrow:"กำลังเปิดรับสมัคร · พนักงานรายวัน",h1:"ร่วมงานกับ <em>UNITECH PCB</em><br>โรงงานผลิตแผ่นวงจรพิมพ์",
  sub:"นิคมอุตสาหกรรม S-Angthong จ.อ่างทอง · มีสอนงาน มีหอพัก มีอาหารฟรี",cta1:"ดูตำแหน่งที่เปิดรับ",cta2:"สวัสดิการ",
  stOpen:"ตำแหน่งที่เปิดรับ",stSlots:"อัตราที่ต้องการ",stWage:"บาท/วัน เริ่มต้น",slotsTag:n=>`👥 รับ ${n} อัตรา`,
  payLead:"สวัสดิการสำหรับพนักงานรายวัน",howLead:"สมัครออนไลน์ได้ทันที ใช้เวลาไม่ถึง 10 นาที",stTxt:"สมัครไปแล้ว? ตรวจสอบผลการพิจารณาได้ที่นี่",
  d1:"ดูตำแหน่งงาน",d2:"📞 โทรสอบถาม",ctT:"ติดต่อสอบถาม",ctLead:"ฝ่ายบุคคล (HR) · กดเพื่อโทรได้ทันที",ext:"ต่อ",call:"โทร",anyGender:"ไม่จำกัดเพศ",hl:["🚻 ไม่จำกัดเพศ","🎂 ไม่จำกัดอายุสูงสุด (18+)","🌙 มีตำแหน่งกะดึกยาวตลอด","🎓 ไม่มีประสบการณ์ มีสอนงาน"],emptyIcon:"🔍"});
Object.assign(T.my,{brandSub:"Ang Thong",eyebrow:"လက်ရှိ အလုပ်ခေါ်နေသည် · နေ့စား ဝန်ထမ်း",h1:"<em>UNITECH PCB</em> နှင့်<br>အတူ လုပ်ကိုင်ပါ",
  sub:"S-Angthong စက်မှုဇုန်၊ Ang Thong · အလုပ်သင်ပေးမည်၊ အဆောင်ရှိ၊ အစားအစာ အခမဲ့",cta1:"ခေါ်နေသော ရာထူးများ",cta2:"ခံစားခွင့်များ",
  stOpen:"ခေါ်နေသော ရာထူး",stSlots:"လိုအပ်သူ ဦးရေ",stWage:"ဘတ်/ရက် မှ စတင်",slotsTag:n=>`👥 ${n} ဦး လိုအပ်`,
  payLead:"နေ့စား ဝန်ထမ်းများအတွက် ခံစားခွင့်",howLead:"အွန်လိုင်းမှ ချက်ချင်း လျှောက်ထားနိုင်သည်",stTxt:"လျှောက်ပြီးပြီလား? ရလဒ်ကို ဤနေရာတွင် စစ်ဆေးပါ",
  d1:"ရာထူးများ ကြည့်ရန်",d2:"📞 ဖုန်းဆက်ရန်",ctT:"ဆက်သွယ်ရန်",ctLead:"လူ့စွမ်းအားအရင်းအမြစ် (HR) · နှိပ်၍ ဖုန်းဆက်နိုင်သည်",ext:"ext.",call:"ဖုန်းဆက်",anyGender:"ကျား/မ မရွေး",hl:["🚻 ကျား/မ မရွေး","🎂 အသက်အကြီးဆုံး ကန့်သတ်ချက်မရှိ (18+)","🌙 ညဆိုင်း အမြဲတမ်း ရာထူးရှိ","🎓 အတွေ့အကြုံမရှိလည်း သင်ပေးမည်"],emptyIcon:"🔍"});
const GSTYLE={PD1:["⚙️","#e6efff"],PD2:["🔬","#eae8ff"],PD3:["🎨","#ffeef3"],PD4:["⚡","#fff3dd"],QC:["🧪","#e3f6ec"],QA:["✅","#e2f5f8"],MT:["🔧","#ffeede"],WH:["📦","#f0ece4"]};
const BEN_ICON=["💵","⭐","⏱️","🌙","🚌","🏠","🍱","🩺","👕","🛡️","🏖️","🏦","📚"];

let lang="th",group="all",showAll=false,STATUS={},updated="",loading=true;
try{const q=new URLSearchParams(location.search).get("lang");if(q==="my"||q==="th")lang=q;else{const s=localStorage.getItem("jobsLang");if(s)lang=s;}}catch(e){}
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ul=a=>`<ul>${a.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`;
const isOpen=j=>STATUS[j.id]&&STATUS[j.id].open;
const isExp=j=>j.group==="MT"||j.group==="WH";
const gname=id=>{const g=GROUPS.find(x=>x.id===id);return g?g[lang]:""};
const openSet=new Set();
const shiftOf=j=>NIGHT_ONLY.includes(j.id)?"night":DAY_ONLY.includes(j.id)?"day":"both";
const SHIFT_TAG={th:{night:"🌙 กะดึกยาวตลอด",day:"☀️ กะเช้าอย่างเดียว",both:"🕗 กะเช้า / กะดึก"},my:{night:"🌙 ညဆိုင်း အမြဲတမ်း",day:"☀️ နေ့ဆိုင်းသာ",both:"🕗 နေ့/ည ဆိုင်း"}};
const telHref=c=>"tel:"+c.tel.replace(/\D/g,"")+(c.ext?","+c.ext:"");

function render(){
  const t=T[lang];
  document.documentElement.lang=lang==="my"?"my":"th";
  document.body.classList.toggle("my",lang==="my");
  document.querySelectorAll(".lang button").forEach(b=>b.classList.toggle("on",b.dataset.l===lang));
  $("brand").innerHTML=(LOGO_URL?`<img src="${esc(LOGO_URL)}" alt="UNITECH">`:`<span class="dot">U</span>`)+`<span>UNITECH PCB<small>${t.brandSub}</small></span>`;
  $("eyebrow").textContent=t.eyebrow; $("h1").innerHTML=t.h1; $("sub").textContent=t.sub;
  $("hl").innerHTML=t.hl.map(x=>`<span>${x}</span>`).join("");
  $("cta1").textContent=t.cta1; $("cta2").textContent=t.cta2;

  const openJobs=JOBS.filter(isOpen);
  const totalSlots=openJobs.reduce((a,j)=>a+(STATUS[j.id].slots||0),0);
  $("stats").innerHTML=[[loading?"–":openJobs.length,t.stOpen],[loading?"–":(totalSlots||"–"),t.stSlots],["348+",t.stWage]]
    .map(([v,l])=>`<div class="stat"><b>${v}</b><span>${l}</span></div>`).join("");

  if(group!=="all"&&!openJobs.some(j=>j.group===group))group="all";
  const base=openJobs, cnt=g=>base.filter(j=>g==="all"||j.group===g).length;
  $("chips").innerHTML=`<button class="chip ${group==="all"?"on":""}" data-g="all">${t.all}<span class="n">${cnt("all")}</span></button>`+
    GROUPS.filter(g=>cnt(g.id)>0).map(g=>`<button class="chip ${group===g.id?"on":""}" data-g="${g.id}">${GSTYLE[g.id][0]} ${esc(g[lang])}<span class="n">${cnt(g.id)}</span></button>`).join("");
  $("count").textContent=loading?t.loading:t.count(openJobs.length);

  if(loading){$("jobs").innerHTML='<div class="skel"></div>'.repeat(4);}
  else{
    const shown=openJobs.filter(j=>group==="all"||j.group===group);
    $("jobs").innerHTML=shown.length?shown.map((j,i)=>{
      const open=isOpen(j),n=open?(STATUS[j.id].slots||0):0,[icon,tint]=GSTYLE[j.group];
      return `<article class="card ${open?"":"full"} ${openSet.has(j.id)?"open":""}" data-id="${j.id}" style="animation-delay:${Math.min(i,10)*30}ms">
        <div class="ch"><div class="ic" style="background:${tint}">${icon}</div>
          <div class="tt"><div class="top-line"><span class="grp">${esc(gname(j.group))}</span>
            <span class="badge ${open?"b-open":"b-full"}">${open?"● "+t.open:t.full}</span></div>
            <h3 class="title">${esc(j.title[lang])}</h3></div></div>
        <div class="tags">${open&&n>0?`<span class="tag slots">${t.slotsTag(n)}</span>`:""}
          <span class="tag money">💰 ${isExp(j)?"348–550":"375–475"} ${lang==="my"?"ဘတ်/ရက်":"บาท/วัน"}</span>
          <span class="tag ${shiftOf(j)==="night"?"night":""}">${SHIFT_TAG[lang][shiftOf(j)]}</span>
          <span class="tag">📋 ${t.daily}</span><span class="tag">🚻 ${t.anyGender}</span></div>
        <button class="more" data-more>${openSet.has(j.id)?"▴":"▾"} ${t.more}</button>
        <div class="details">
          <div class="sec"><h4>💰 ${t.wage}</h4><div class="kv">${esc(WAGE[isExp(j)?"exp":"std"][lang])}</div></div>
          <div class="sec"><h4>🕗 ${t.shift}</h4><div class="kv">${esc({night:SHIFT_NIGHT,day:SHIFT_DAY,both:SHIFT}[shiftOf(j)][lang])}</div></div>
          <div class="sec"><h4>📝 ${t.duties}</h4>${ul(j.duties[lang])}</div>
          <div class="sec"><h4>✅ ${t.quals}</h4>${ul(j.quals[lang])}</div>
          <div class="sec"><h4>📄 ${t.docs}</h4>${ul(DOCS[lang])}</div>
        </div>
        <div class="cf">${open?`<a class="apply" href="${esc(APPLY_URL)}" target="_blank" rel="noopener">${t.apply} →</a>`
          :`<span class="apply off">${t.full}</span><div class="fn">${t.fullNote}</div>`}</div>
      </article>`}).join(""):`<div class="empty"><div>${t.emptyIcon}</div>${t.empty}</div>`;
  }

  $("payT").textContent=t.payT.replace(/^\S+\s/,""); $("payLead").textContent=t.payLead;
  $("ben").innerHTML=PAY[lang].map((x,i)=>`<div class="bt"><span class="e">${BEN_ICON[i]||"✨"}</span><div>${esc(x)}</div></div>`).join("");
  $("howT").textContent=t.howT.replace(/^\S+\s/,""); $("howLead").textContent=t.howLead;
  $("steps").innerHTML=t.how.map(x=>`<div class="step">${esc(x)}</div>`).join("");
  $("stTxt").textContent=t.stTxt; $("stLink").textContent=t.statusLink+" →"; $("stLink").href=STATUS_URL;
  $("ctT").textContent=t.ctT; $("ctLead").textContent=t.ctLead;
  const cs=lang==="my"?[...CONTACTS].reverse():CONTACTS;
  $("contacts").innerHTML=cs.map(c=>`<a class="ct" href="${telHref(c)}"><span class="av">📞</span><span><b>${esc(lang==="my"?c.my:c.name)}</b><small>${esc(c.tel)} ${t.ext} ${esc(c.ext)}</small></span><span class="go">${t.call}</span></a>`).join("");
  $("d1").textContent=t.d1; $("d2").textContent=t.d2;
  $("foot").textContent=(updated?`${t.updated}: ${updated} · `:"")+"© UNITECH PCB (Thailand) Co., Ltd.";
}

function notice(m){const n=$("notice");n.textContent=m||"";n.style.display=m?"block":"none";}
async function load(){
  if(!SCRIPT_URL){loading=false;notice("⚠️ ยังไม่ได้ใส่ SCRIPT_URL ในไฟล์ jobs.html");render();return;}
  try{const r=await fetch(SCRIPT_URL+"?action=status&t="+Date.now());const d=await r.json();STATUS=d.jobs||{};updated=d.updated||"";}
  catch(e){notice(T[lang].loadErr);}
  loading=false;render();
}

document.querySelector(".lang").addEventListener("click",e=>{const l=e.target.dataset.l;if(!l)return;lang=l;try{localStorage.setItem("jobsLang",l)}catch(x){}render();});
$("chips").addEventListener("click",e=>{const b=e.target.closest("[data-g]");if(!b)return;group=b.dataset.g;render();$("filters").scrollIntoView({behavior:"smooth"});});
$("jobs").addEventListener("click",e=>{
  if(!e.target.closest("[data-more]"))return;
  const c=e.target.closest(".card"),id=c.dataset.id;
  openSet.has(id)?openSet.delete(id):openSet.add(id);
  c.classList.toggle("open");c.querySelector("[data-more]").textContent=(openSet.has(id)?"▴ ":"▾ ")+T[lang].more;
});
new IntersectionObserver(([e])=>$("filters").classList.toggle("stuck",e.intersectionRatio<1),{threshold:[1],rootMargin:"-1px 0px 0px 0px"}).observe($("filters"));
render();load();
</script>
</body>
